name: Sveltia Auto Format

on:
  repository_dispatch:
    types: [sveltia-cms-publish]
    
concurrency:
  group: sveltia-publish
  cancel-in-progress: false
  
permissions:
  contents: read
  
jobs:
  format:
    name: Format Sveltia changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.commit_hash }}
      
    steps:
      - name: Checkout from default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          
      - name: Install dependencies
        run: npm ci
      
      - name: Run Biome format
        run: npm run format
      
      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: Apply formatting changes to Sveltia commit"
          branch: ${{ github.event.repository.default_branch }}
          skip_dirty_check: false
          skip_fetch: false

  lint:
    needs: format
    permissions:
      contents: read
    uses: ./.github/workflows/biome-lint.yml
    with:
      ref: ${{ needs.format.outputs.sha || github.event.repository.default_branch }}

  deploy:
    needs: [format, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Cloudflare Worker Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.CF_BUILD_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CF_BUILD_HOOK_URL secret is not configured"
            exit 1
          fi
          
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -X POST "$DEPLOY_HOOK"
