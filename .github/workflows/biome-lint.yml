name: Biome Code Lint

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  quality:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'sveltia-cms-publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Run Biome
        run: biome ci .
