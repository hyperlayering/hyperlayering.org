name: Code quality

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  quality:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'sveltia-cms-publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
      - name: Run Biome
        run: biome ci .
